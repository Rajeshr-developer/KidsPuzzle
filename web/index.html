<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KidsPuzzle Web</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      /* react-native-web AppContainer is flex:1 — #root must be a flex column with real height */
      #root {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      body {
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
